<!DOCTYPE html>
<html lang="ko">
<head>

    <title>2026-10-08 통합과학 역학</title>
    <style>
        body { font-family: 'Malgun Gothic', sans-serif; background-color: #e5e7eb; display: flex; flex-direction: column; align-items: center; padding: 40px 16px; margin: 0; }
        .exam-paper { background-color: white; max-width: 850px; width: 100%; padding: 50px 40px; box-sizing: border-box; box-shadow: 0 10px 25px rgba(0,0,0,0.1); border-top: 8px solid #1f2937; border-radius: 8px; position: relative; }
        
        /* 1문제씩 보여주기 위한 핵심 설정 */
        .problem-slide { display: none; animation: fadeIn 0.5s; }
        .problem-slide.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateX(10px); } to { opacity: 1; transform: translateX(0); } }
        
        .header-text { display: flex; margin-bottom: 20px; font-size: 18px; line-height: 1.6; }
        .question-num { font-size: 26px; font-weight: bold; margin-right: 12px; font-family: serif; }
        .condition-text { text-align: right; font-size: 14px; margin-bottom: 24px; color: #4b5563; }
        .assets-area { display: flex; flex-direction: column; align-items: center; gap: 24px; margin-bottom: 30px; }
        .svg-box { padding: 15px; background-color: white; border: 1px solid #d1d5db; border-radius: 4px; }
        table { width: 100%; max-width: 550px; border-collapse: collapse; border-top: 2px solid #111827; border-bottom: 2px solid #111827; text-align: center; }
        th { background-color: #f9fafb; border-bottom: 1px solid #111827; padding: 12px; font-weight: bold; }
        td { padding: 12px; border-bottom: 1px solid #e5e7eb; font-size: 17px; }
        th, td { border-left: 1px solid #d1d5db; border-right: 1px solid #d1d5db; }
        th:first-child, td:first-child { border-left: none; }
        th:last-child, td:last-child { border-right: none; }
        .bogi-box { border: 1px solid #1f2937; padding: 24px; margin: 24px 0; font-size: 18px; }
        .bogi-title { display: block; text-align: center; margin-bottom: 20px; }
        .bogi-title span { border: 1px solid #1f2937; padding: 4px 16px; font-weight: bold; }
        .bogi-list { list-style: none; padding-left: 10px; margin: 0; }
        .bogi-list li { margin-bottom: 16px; display: flex; }
        .bogi-list span.marker { font-weight: bold; margin-right: 10px; }
        .options { display: flex; justify-content: space-around; font-size: 18px; margin-top: 30px; margin-bottom: 40px; }
        
        .solution-btn { padding: 10px 20px; background-color: #4b5563; color: white; font-weight: bold; font-size: 15px; border: none; border-radius: 4px; cursor: pointer; }
        .solution-box { display: none; width: 100%; margin-top: 20px; padding: 24px; background-color: #f8fafc; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 16.5px; line-height: 1.7; box-sizing: border-box; }
        .solution-box.active { display: block; }
        i { font-family: serif; padding: 0 2px;}

        /* 아래첨자/위첨자 렌더링 강제 교정 CSS */
        sub { vertical-align: sub; font-size: 0.75em; line-height: 1; }
        sup { vertical-align: super; font-size: 0.75em; line-height: 1; }

        /* 네비게이션 버튼 (목록으로, 다음 문제) */
        .nav-bar { display: flex; justify-content: space-between; align-items: center; margin-top: 40px; padding-top: 20px; border-top: 2px dashed #d1d5db; }
        .nav-btn { padding: 12px 24px; font-size: 16px; font-weight: bold; border-radius: 6px; cursor: pointer; text-decoration: none; border: none; }
        .btn-back { background-color: #f3f4f6; color: #374151; border: 1px solid #d1d5db; }
        .btn-next { background-color: #2563eb; color: white; display: flex; flex-direction: column; align-items: flex-end; }
        .btn-next .preview-text { font-size: 12px; color: #bfdbfe; margin-top: 4px; font-weight: normal; }
    </style>
</head>
