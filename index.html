<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>통합과학 모의고사 ARCHIEVE</title>
    <style>
        /* 기본 여백 및 폰트 초기화 */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            /* 깔끔한 웹 폰트 세팅 */
            font-family: 'Pretendard', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; 
            background-color: #fafafa; /* 아주 밝은 쿨그레이 배경 */
            color: #1a1a1a; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            min-height: 100vh;
        }
        
        /* 상단 헤더 영역 (모던한 느낌) */
        .header {
            width: 100%;
            background-color: #ffffff;
            padding: 70px 20px 50px;
            text-align: center;
            border-bottom: 1px solid #eaeaea;
            margin-bottom: 50px;
        }
        .header h1 {
            font-size: 34px;
            font-weight: 800;
            letter-spacing: -1px;
            color: #111827;
            margin-bottom: 14px;
        }
        .header p {
            font-size: 17px;
            color: #6b7280;
            letter-spacing: -0.5px;
        }

        /* 메인 컨텐츠 영역 */
        .container {
            width: 100%;
            max-width: 1000px;
            padding: 0 20px;
        }

        /* 반응형 그리드 정렬 */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 28px;
            padding-bottom: 80px;
        }

        /* 개별 문제 박스 (카드형 UI) */
        .card {
            background: #ffffff;
            border-radius: 20px;
            padding: 36px 32px;
            text-decoration: none;
            color: inherit;
            border: 1px solid #f3f4f6;
            box-shadow: 0 10px 30px rgba(0,0,0,0.03); /* 은은한 그림자 */
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }
        
        /* 마우스 올렸을 때 나타나는 상단 그라데이션 포인트 */
        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(90deg, #374151, #111827); /* 모노톤 그라데이션 */
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        /* 마우스 호버 효과 */
        .card:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.08);
            border-color: #e5e7eb;
        }
        .card:hover::before {
            opacity: 1;
        }

        /* 카드 내 날짜 및 문항수 뱃지 */
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .date {
            font-size: 15px;
            font-weight: 600;
            color: #9ca3af;
            letter-spacing: 0.5px;
        }
        .badge {
            background-color: #f3f4f6;
            color: #4b5563;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 700;
        }

        /* 모의고사 제목 */
        .title {
            font-size: 24px;
            font-weight: 700;
            line-height: 1.4;
            color: #1f2937;
            margin-bottom: 24px;
            letter-spacing: -0.5px;
        }

        /* 하단 이동 버튼 */
        .footer {
            margin-top: auto;
            display: flex;
            align-items: center;
            font-size: 15px;
            color: #374151;
            font-weight: 700;
        }
        .footer svg {
            width: 18px;
            height: 18px;
            margin-left: 6px;
            transition: transform 0.2s;
        }
        .card:hover .footer svg {
            transform: translateX(6px); /* 화살표가 우측으로 살짝 이동 */
        }
    </style>
</head>
<body>
    
    <header class="header">
        <h1>Science Exam Archive</h1>
        <p> 통합과학 및 생명과학 모의고사 보관소</p>
    </header>
    
    <<main class="container">
    
    <!-- 과목 필터 버튼 영역 -->
    <div class="filter-container">
        <!-- 버튼 클릭 시 filterExams('과목태그', this) 함수가 실행됩니다 -->
        <button class="filter-btn active" onclick="filterExams('all', this)">전체보기</button>
        <button class="filter-btn" onclick="filterExams('earth', this)">지구과학</button>
        <button class="filter-btn" onclick="filterExams('physics', this)">물리학</button>
        <button class="filter-btn" onclick="filterExams('life', this)">생명과학</button>
    </div>

    <!-- 문제 박스가 자동으로 들어갈 빈 공간 -->
    <div class="grid" id="exam-grid"></div>

</main>
        
<!-- 데이터 파일 불러오기 -->
<script src="exam-data.js"></script>

<!-- 필터링 및 화면 그리기 스크립트 -->
<script>
    const grid = document.getElementById("exam-grid");

    // 1. 화면에 박스를 그려주는 함수
    function renderExams(subjectFilter) {
        grid.innerHTML = ""; // 기존에 그려진 박스들을 전부 지움

        examList.forEach(exam => {
            // 'all'이거나, 내가 누른 과목과 데이터의 과목이 일치할 때만 그림
            if (subjectFilter === 'all' || exam.subject === subjectFilter) {
                const cardHTML = `
                    <a href="${exam.link}" class="card">
                        <div class="card-header">
                            <span class="date">${exam.date}</span>
                            <span class="badge">총 ${exam.count}문항</span>
                        </div>
                        <div class="title">${exam.title} <br>실전 모의고사</div>
                        <div class="footer">
                            문제 풀기
                            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
                        </div>
                    </a>
                `;
                grid.innerHTML += cardHTML; // 화면에 밀어넣기
            }
        });
    }

    // 2. 버튼 클릭 시 작동하는 함수
    function filterExams(subject, btnElement) {
        // 모든 버튼의 색상을 원래대로(흰색) 되돌림
        const buttons = document.querySelectorAll('.filter-btn');
        buttons.forEach(btn => btn.classList.remove('active'));
        
        // 방금 클릭한 버튼만 색상을 진하게(활성화) 변경함
        btnElement.classList.add('active');

        // 선택한 과목에 맞춰서 화면 다시 그리기
        renderExams(subject);
    }

    // 처음 사이트에 접속했을 때는 '전체보기'로 화면을 채움
    renderExams('all');
</script>


</body>
</html>
